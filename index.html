.wrap{max-width:1320px;margin:0 auto;padding-block:16px 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 9px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}

.kpi{background:var(--surface);padding:10px 14px}
.kpi b{display:block;font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.kpi span{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{color:var(--faint);font-size:11.5px}
.kpi.hl span{color:var(--accent)}

/* layout */

nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px}
nav.side h4{margin:12px 0 4px;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.08em}
nav.side h4:first-child{margin-top:0}
nav.side button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13.5px}
nav.side button:hover{background:var(--sunk);color:var(--ink)}

  nav.side h4{display:none}
  nav.side button{white-space:nowrap;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
}
.panel{min-width:0}
.panel h2{font-size:17px;margin:0 0 4px}
.panel .lead{color:var(--muted);margin:0 0 16px;max-width:72ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600}
.card h3 small{font-weight:400;color:var(--faint);margin-left:6px}

.fld .in em{font-style:normal;font-size:12px;color:var(--muted);padding-right:8px;white-space:nowrap}
.fld small{font-size:11.5px;color:var(--faint);min-height:1em}
.fld.wide{grid-column:1/-1}
textarea{width:100%;min-height:84px;background:var(--inbg);border:1px solid var(--inline);border-radius:5px;padding:8px;resize:vertical;line-height:1.6}
.legend-in{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend-in i{width:14px;height:10px;background:var(--inbg);border:1px solid var(--inline);border-radius:2px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.card .tw{border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--sunk);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.sub td{background:var(--sunk);font-weight:600}
tr.tot td{background:var(--accent-soft);font-weight:700;border-top:1px solid var(--accent)}
tr.grp td:first-child{font-weight:600}
td.neg,span.neg{color:var(--neg)}
td .muted,.muted{color:var(--faint)}
td.note{color:var(--muted);font-size:12px;min-width:220px}
table.edit td{padding:3px 4px}
table.edit input{width:100%;min-width:70px;border:1px solid transparent;background:var(--inbg);padding:5px 6px;border-radius:4px}
table.edit input.r{text-align:right;font-variant-numeric:tabular-nums}

.x:hover{color:var(--neg)}
.row-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* cf table */
.cf th,.cf td{padding:4px 8px;font-size:12px}

.cf th:first-child{background:var(--sunk)}
.cf .mk{color:var(--accent);font-weight:700}
.cf td.z{color:var(--line)}

/* callouts */
.flag{display:flex;gap:8px;align-items:flex-start;background:var(--warnbg);color:var(--ink);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.flag b{color:var(--warn)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600}
.pill.ok{background:var(--accent-soft);color:var(--pos)}
.pill.bad{background:var(--warnbg);color:var(--neg)}

/* chart */
.chart{overflow-x:auto}
.chart svg{display:block;min-width:640px;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}
.chart .grid-l{stroke:var(--line2)}
.chart .axis{stroke:var(--line)}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.keys i{display:inline-block;width:12px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}

/* gantt */
.gantt{display:grid;gap:4px;font-size:12px}
.gantt .gr{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center}
.gantt .track{position:relative;height:16px;background:var(--sunk);border-radius:3px}
.gantt .bar{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px;min-width:4px}
.gantt .bar.pt{background:var(--loan);width:6px!important;border-radius:50%}
.gantt .scale{display:flex;justify-content:space-between;color:var(--faint);font-size:11px}

/* sensitivity */
.heat td.n{min-width:84px}
.heat td.base{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}

/* document */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:40px clamp(18px,5vw,56px);max-width:900px}

.doc .cover p{margin:0;color:var(--muted);font-size:13px}

.doc h3{font-size:14px;margin:18px 0 8px}
.doc p{max-width:72ch;margin:0 0 10px}
.doc table{font-size:12.5px;margin-bottom:10px}
.doc .tw{border-radius:4px}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:4px}
.doc .src{font-size:11.5px;color:var(--faint)}

/* modal */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:18px;width:min(680px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,20,18,.45)}
dialog textarea{min-height:280px;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--sunk);border-color:var(--line)}
dialog h3{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:6px;font-size:13px;z-index:50}

@media print{
  body{background:#fff;padding:0}
  .top,.kpis,nav.side,.noprint{display:none!important}
  .main{display:block}
  .doc{border:0;padding:0;max-width:none}
  .doc h2{break-after:avoid}
  .doc table{break-inside:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const PY=0.3025;

const DIV={"원":1,"천원":1e3,"백만원":1e6,"억원":1e8};
function fm(v,dec){ if(v==null||isNaN(v)) return "-"; const d=dec??(UNIT==="억원"?1:0); const x=v/DIV[UNIT];
  if(Math.abs(x)<0.5*Math.pow(10,-d)) return "-";
  const s=Math.abs(x).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d}); return x<0?"△"+s:s; }
const won=v=>(v<0?"△":"")+Math.round(Math.abs(v)).toLocaleString("ko-KR");
const n0=(v,d=0)=>isFinite(v)?Number(v).toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d}):"-";
const pc=(v,d=1)=>isFinite(v)?(v<0?"△":"")+(Math.abs(v)*100).toFixed(d)+"%":"-";
const eok=v=>(v<0?"△":"")+(Math.abs(v)/1e8).toLocaleString("ko-KR",{minimumFractionDigits:1,maximumFractionDigits:1})+"억원";
function ym(start,m){ const [y,mo]=start.split("-").map(Number); const t=y*12+(mo-1)+m; return Math.floor(t/12)+"."+String(t%12+1).padStart(2,"0"); }
function getP(o,p){ return p.split(".").reduce((a,k)=>a==null?a:a[k],o); }
function setP(o,p,v){ const ks=p.split("."); const last=ks.pop(); const t=ks.reduce((a,k)=>a[k],o); t[last]=v; }
function sCurve(n){ if(n<=0) return []; const w=[]; for(let i=0;i<n;i++){ const x=(i+.5)/n; w.push(Math.sin(Math.PI*x)**1.3+0.15); } const s=w.reduce((a,b)=>a+b,0); return w.map(v=>Math.round(v/s*1000)/1000); }
function curveOf(S){ const c=S.lh.curve||[]; return c.length===S.sched.cons? c : sCurve(S.sched.cons); }

function sepTax(b){ if(b<=2e8) return b*0.002; if(b<=1e9) return b*0.003-200000; return b*0.004-1200000; }

// 자기자본 = 토지매입비 × 비율 (백만원 단위 올림)
// 특약보증 한도 부족 시: 부족액을 억원 단위로 올려 자기자본에 가산 → 보증수수료·이자 재계산 → 한도 충족까지 반복
function compute(S, ov={}){
  let R=computeCore(S, ov, null);
  const eqBase=R.equity, short0=Math.max(R.needLoan-R.hugCap,0);
  let add=0;
  if(S.fin.autoEq!==false){
    for(let i=0;i<20 && R.needLoan>R.hugCap;i++){ add+=Math.ceil((R.needLoan-R.hugCap)/1e8)*1e8; R=computeCore(S, ov, eqBase+add); }
  }
  return Object.assign(R,{eqBase, eqAdd:add, eqShort0:short0});
}
function computeCore(S, ov, eqOverride){
  const L=S.land, C=S.cost, F={...S.fin,...(ov.fin||{})}, T=S.tax, SC=S.sched;
  const rP=1+(ov.priceR||0), rB=1+(ov.buildR||0), rL=1+(ov.landR||0);
  const eqRate=ov.eqRate??L.eqRate;
  const landPy=(+S.site.siteM2||0)*PY, gfaPy=(+S.bldg.gfaM2||0)*PY;
  const units=S.units.reduce((a,u)=>a+(+u.count||0),0);
  const rev=S.units.reduce((a,u)=>a+(+u.count||0)*(+u.price||0)*rP,0);

  // 일정(상대월)
  const m={}; m.m1=0; m.m2=+SC.permit; m.m3=m.m2; m.m4=m.m3+(+SC.prep); m.m5=m.m4+(+SC.cons); m.m6=m.m5+(+SC.approval); m.m7=m.m6+(+SC.occupancy);
  const cons=+SC.cons;

  // ① 토지비
  const I={};
  I.landBuy=landPy*L.unit*rL; I.acq=I.landBuy*L.acqRate*(1-L.acqRelief); I.transfer=+L.transfer||0;
  // ② 건축비
  I.cons=gfaPy*C.buildUnit*rB; I.extra=+C.extra||0; I.design=gfaPy*C.designUnit; I.superv=gfaPy*C.superUnit;
  I.demo=(+S.bldg.existingPy||0)*C.demoUnit; I.utility=+C.utility||0; I.art=+C.art||0;
  const buildSub=I.cons+I.extra+I.design+I.superv+I.demo+I.utility+I.art;
  // ③ 제세공과 (재산세: 과세기준일 6.1 보유분, 9월 납부)
  I.preserve=buildSub*C.preserveRate; I.bond=+C.bond||0; I.levy=+C.levy||0;
  const official=S.site.parcels.reduce((a,p)=>a+(+p.m2||0)*(+p.price||0),0);
  const [sy,sm]=SC.start.split("-").map(Number);
  const taxRows=[];
  for(let y=sy; y<=sy+Math.ceil((m.m7+12)/12); y++){
    const jun=(y-sy)*12+(6-sm);            // 6월의 상대월
    if(jun<0 || jun>=m.m6) continue;        // 취득 이후 ~ LH 매매계약(⑥) 이전 과세기준일
    const base=official*Math.pow(1+T.growth, y-T.baseYear)*T.fmv;
    const prop=sepTax(base), city=base*T.cityRate, edu=prop*T.eduRate;
    taxRows.push({y, base, prop, city, edu, total:prop+city+edu, comp:+T.compYearly||0, mSep:(y-sy)*12+(9-sm), mDec:(y-sy)*12+(12-sm)});
  }
  I.prop=taxRows.reduce((a,r)=>a+r.total,0); I.comp=taxRows.reduce((a,r)=>a+r.comp,0);
  // ④ 판매비 — 분양보증수수료
  const sgAmt=rev*C.sgRatio, sgL=sgAmt*C.sgLandShare, sgB=sgAmt-sgL;
  I.salesGuar=(sgL*C.sgLandRate+sgB*C.sgBldgRate)*cons/12;
  // ⑤ 부대비
  I.trust=rev*C.trustRate; I.cont=I.cons*C.contRate;
  const landSub=I.landBuy+I.acq+I.transfer, taxSub=I.preserve+I.bond+I.levy+I.prop+I.comp, saleSub=I.salesGuar, miscSub=I.trust+I.cont;
  const subtotal=landSub+buildSub+taxSub+saleSub+miscSub;
  // ⑥ HUG 특약보증수수료
  const equity=eqOverride ?? Math.ceil(I.landBuy*eqRate/1e6)*1e6;
  const guarBase=subtotal-equity;
  I.hug=guarBase*C.hugRate*cons/12;

  // LH 매입대금 지급 구조
  const apprLand=landPy*L.apprUnit, support=apprLand*L.supportRate, cap=rev*S.lh.cap, conBase=cap-support;
  const curve=curveOf(S), segs=[];
  for(let k=0;k*3<cons;k++){ const s=k*3, e=Math.min(s+3,cons); const pct=curve.slice(s,e).reduce((a,b)=>a+b,0);
    segs.push({no:k+1, from:s+1, to:e, pct, amt:conBase*pct, month:m.m4+e+(+S.lh.lag)}); }
  const segSum=segs.reduce((a,s)=>a+s.amt,0);
  const deposit=cap-support-segSum, balance=rev-cap;

  // 월별 배치
  let N=m.m7; segs.forEach(s=>N=Math.max(N,s.month)); taxRows.forEach(r=>N=Math.max(N,r.mSep, r.comp?r.mDec:0));
  const rows={}, put=(k,mo,v)=>{ if(!v) return; rows[k]=rows[k]||new Array(N+1).fill(0); rows[k][Math.min(Math.max(mo,0),N)]+=v; };
  put("r_support",m.m3,support); segs.forEach(s=>put("r_con",s.month,s.amt)); put("r_dep",m.m6,deposit); put("r_bal",m.m7,balance);
  put("c_land",m.m1,I.landBuy*L.depositRate); put("c_land",m.m3,I.landBuy*(1-L.depositRate)+I.acq+I.transfer);
  for(let i=1;i<=cons;i++) put("c_build",m.m4+i,(I.cons+I.extra)*(curve[i-1]||0));
  put("c_design",m.m1,I.design*.1); put("c_design",m.m1+4,I.design*.4); put("c_design",m.m2,I.design*.5);
  const nb=Math.max(Math.floor((cons-1)/2),0); put("c_super",m.m4,I.superv*.1);
  for(let k=1;k<=nb;k++) put("c_super",m.m4+2*k,I.superv*.9/(nb+1)); put("c_super",m.m6,I.superv*.9/(nb+1));
  put("c_demo",m.m4,I.demo); put("c_util",m.m5,I.utility+I.art);
  put("c_cont",m.m2,I.cont*.5); put("c_cont",m.m6,I.cont*.5);
  put("c_reg",m.m6,I.preserve+I.bond); put("c_guar",m.m4,I.salesGuar+I.hug); put("c_levy",m.m2,I.levy);
  taxRows.forEach(r=>{ put("c_tax",r.mSep,r.total); put("c_tax",r.mDec,r.comp); });
  put("c_trust",m.m2,I.trust); put("eq",m.m1,equity);
  const z=()=>new Array(N+1).fill(0), g=k=>rows[k]||z();
  const revM=z(), costM=z(), bal=z(), intM=z(), idle=z();
  const revKeys=["r_support","r_con","r_dep","r_bal"], costKeys=["c_land","c_build","c_design","c_super","c_demo","c_util","c_cont","c_reg","c_guar","c_levy","c_tax","c_trust"];
  let prev=0, cash=0, eqCash=0, peak=0, peakM=0;
  for(let t=0;t<=N;t++){
    revM[t]=revKeys.reduce((a,k)=>a+g(k)[t],0); costM[t]=costKeys.reduce((a,k)=>a+g(k)[t],0);
    const net=costM[t]-revM[t]-g("eq")[t];
    if(F.reuse){ let pos=prev-cash+net; bal[t]=Math.max(pos,0); cash=Math.max(-pos,0); }
    else { // 자기자본은 이후 사업비에 먼저 사용, LH 수령 잉여현금만 유보(원 모델과 동일)
      eqCash+=g("eq")[t]; let x=prev+costM[t]-revM[t];
      const use=Math.min(eqCash,Math.max(x,0)); eqCash-=use; x-=use;
      bal[t]=Math.max(x,0); cash+=Math.max(-x,0); }
    idle[t]=cash+eqCash;
    intM[t]=t===0?0:(prev+bal[t])/2*F.rate/12;   // 월0 이자 없음(원 엑셀 산식과 동일)
    if(bal[t]>peak){ peak=bal[t]; peakM=t; } prev=bal[t];
  }
  I.interest=intM.reduce((a,b)=>a+b,0); I.fee=peak*F.feeRate; const quarters=Math.ceil((m.m7-m.m3)/3); I.agent=quarters*F.agentQ;
  const finSub=I.interest+I.fee+I.agent;
  const total=subtotal+I.hug+finSub, profit=rev-total;
  const moic=equity>0?(equity+profit)/equity:NaN, irr=equity>0&&moic>0?Math.pow(moic,12/m.m7)-1:NaN;

  // HUG 보증한도
  const hugTotal=rev*F.hugBase, hugCap=hugTotal*F.hugLimit, needLoan=total-equity;
  return { landPy, gfaPy, units, rev, m, I, taxRows, official, sgAmt, sgL, sgB, landSub, buildSub, taxSub, saleSub, miscSub, subtotal, equity, guarBase,
    apprLand, support, cap, conBase, curve, segs, segSum, deposit, balance, N, rows, revM, costM, bal, intM, idle, peak, peakM, quarters, finSub, total, profit,
    margin:rev?profit/rev:NaN, moic, irr, hugTotal, hugCap, needLoan, curveSum:curve.reduce((a,b)=>a+b,0) };
}

function fld(p,label,o={}){
  const k=o.k||"num", v=getP(S,p); let shown;
  if(k==="pct") shown=v==null?"":+(v*100).toFixed(4);
  else if(k==="num") shown=v==null?"":Number(v).toLocaleString("ko-KR",{maximumFractionDigits:6});
  else shown=v??"";
  const id="f-"+p.replace(/\./g,"-");
  const note=o.live?`<small data-live="${o.live}"></small>`:`<small>${esc(o.note||"")}</small>`;
  return `<label class="fld ${o.wide?"wide":""}" for="${id}"><span>${esc(label)}</span><div class="in"><input id="${id}" data-p="${p}" data-k="${k}" value="${esc(shown)}" ${k==="num"||k==="pct"?'inputmode="decimal"':""}>${o.u?`<em>${esc(o.u)}</em>`:""}</div>${note}</label>`;
}
function area(p,label){ const id="f-"+p.replace(/\./g,"-"); return `<label class="fld wide" for="${id}"><span>${esc(label)}</span><textarea id="${id}" data-p="${p}" data-k="text">${esc(getP(S,p))}</textarea></label>`; }
function parseIn(el){ const k=el.dataset.k, raw=el.value; if(k==="text"||k==="month") return raw;
  const n=parseFloat(String(raw).replace(/,/g,"")); if(isNaN(n)) return 0; return k==="pct"?n/100:n; }

function editTable(path,cols){
  const arr=getP(S,path);
  const head=cols.map(c=>`<th class="${c.num?"n":""}">${esc(c.h)}</th>`).join("")+"<th></th>";
  const body=arr.map((r,i)=>"<tr>"+cols.map(c=>{ const v=r[c.f]; const shown=c.num?(c.pct?+(v*100).toFixed(3):Number(v||0).toLocaleString("ko-KR",{maximumFractionDigits:4})):(v??"");
      return `<td><input id="t-${path}-${i}-${c.f}" aria-label="${esc(c.h)} ${i+1}행" class="${c.num?"r":""}" data-p="${path}.${i}.${c.f}" data-k="${c.num?(c.pct?"pct":"num"):"text"}" value="${esc(shown)}" style="${c.w?"min-width:"+c.w+"px":""}"></td>`; }).join("")
      +`<td><button class="x" type="button" data-del="${path}" data-i="${i}" aria-label="${i+1}행 삭제">✕</button></td></tr>`).join("");
  return `<div class="tw"><table class="edit"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="row-actions"><button class="btn" type="button" data-add="${path}">+ 행 추가</button></div>`;
}

    ["","추가공사비",I.extra,"정액"],["","설계비",I.design,`연면적 × ${n0(S.cost.designUnit)}원`],["","감리비",I.superv,`연면적 × ${n0(S.cost.superUnit)}원`],
    ["","철거비",I.demo,`기존 ${n0(S.bldg.existingPy,1)}평 × ${n0(S.cost.demoUnit)}원`],["","인입비 등",I.utility,""],["","예술장식품비",I.art,""],
    ["sub","② 건축비 소계",R.buildSub],
    ["③ 제세공과","보존등기비",I.preserve,`건축비 소계 × ${pc(S.cost.preserveRate,2)}`],["","국민주택채권 할인",I.bond,""],["","각종 부담금",I.levy,""],
    ["","재산세",I.prop,`${R.taxRows.map(r=>r.y).join("·")}년 과세분 (별도합산)`],["","종합부동산세",I.comp,""],

    ["sub","⑤ 부대비 소계",R.miscSub],
    ["sub","소계 (①~⑤)",R.subtotal],
    ["⑥ 보증료","HUG 특약보증수수료",I.hug,`(소계 − 자기자본) × ${pc(S.cost.hugRate,2)} × ${S.sched.cons}/12`],
    ["⑦ 금융비","대출이자",I.interest,`연 ${pc(S.fin.rate,2)}, 월평균잔액 기준`],["","취급수수료",I.fee,`최대잔액 × ${pc(S.fin.feeRate,2)}`],["","대리은행수수료",I.agent,`${R.quarters}분기 × ${n0(S.fin.agentQ/1e4)}만원`],

function warnings(R){ const w=[];
  if(Math.abs(R.curveSum-1)>0.0005) w.push(`공정률 합계가 ${pc(R.curveSum,1)}입니다. 100%가 아니면 차액이 ⑥ 계약금으로 정산됩니다.`);
  if(S.lh.curve.length!==+S.sched.cons) w.push(`공정률 입력(${S.lh.curve.length}개월)이 공사기간(${S.sched.cons}개월)과 달라 표준 S-곡선을 임시 적용했습니다. [토지·LH 매입조건]에서 곡선을 생성하거나 입력하세요.`);
  if(R.eqAdd) w.push(`특약보증 한도 부족(${fm(R.eqShort0)}${UNIT})으로 자기자본을 ${eok(R.eqAdd)} 증액해 보정했습니다 (${eok(R.eqBase)} → ${eok(R.equity)}).`);
  if(R.needLoan>R.hugCap) w.push(`보증대상 소요액(총사업비−자기자본 ${fm(R.needLoan)}${UNIT})이 특약보증 한도(${fm(R.hugCap)}${UNIT})를 ${fm(R.needLoan-R.hugCap)}${UNIT} 초과합니다.`);
  if(R.profit<0) w.push("세전 사업손익이 적자입니다.");
  return w.map(t=>`<div class="flag"><b>확인</b><span>${t}</span></div>`).join(""); }

function cfChart(R){
  const N=R.N, W=Math.max(700,(N+1)*26+80), H=260, pl=56, pr=16, pt=14, pb=28, ih=H-pt-pb;
  const maxBar=Math.max(...R.revM,...R.costM,...R.bal,1), sc=v=>v/maxBar*ih;
  const bw=(W-pl-pr)/(N+1), x=t=>pl+t*bw;
  const ticks=[0,.25,.5,.75,1].map(f=>f*maxBar);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 매출·사업비·대출잔액">`;
  ticks.forEach(v=>{ const y=pt+ih-sc(v); s+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${(v/1e8).toFixed(0)}억</text>`; });
  for(let t=0;t<=N;t++){ const cx=x(t);
    if(R.revM[t]) s+=`<rect x="${cx+bw*.12}" y="${pt+ih-sc(R.revM[t])}" width="${bw*.36}" height="${sc(R.revM[t])}" fill="var(--bar-in)"><title>월${t} 매출 ${eok(R.revM[t])}</title></rect>`;
    if(R.costM[t]) s+=`<rect x="${cx+bw*.5}" y="${pt+ih-sc(R.costM[t])}" width="${bw*.36}" height="${sc(R.costM[t])}" fill="var(--bar-out)"><title>월${t} 사업비 ${eok(R.costM[t])}</title></rect>`;
    if(t%3===0) s+=`<text x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${t}</text>`; }
  const pts=R.bal.map((v,t)=>`${x(t)+bw/2},${pt+ih-sc(v)}`).join(" ");
  s+=`<polyline points="${pts}" fill="none" stroke="var(--loan)" stroke-width="2"/>`;
  const px=x(R.peakM)+bw/2, py=pt+ih-sc(R.peak);
  s+=`<circle cx="${px}" cy="${py}" r="4" fill="var(--loan)"/><text x="${px+6}" y="${py-6}" style="fill:var(--loan);font-weight:600">최대 ${eok(R.peak)} (월${R.peakM})</text>`;
  s+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/></svg>`;
  return `<div class="chart">${s}</div><div class="keys"><span><i style="background:var(--bar-in)"></i>매출(LH 수령)</span><span><i style="background:var(--bar-out)"></i>사업비 지출</span><span><i style="background:var(--loan);height:3px"></i>대출잔액</span></div>`;
}

    ["[자금]",null,"h"],["자기자본 투입","eq"],["대출잔액 (월말)","bal","s"],["월 이자","intM"],["유보 잉여현금","idle"]];

  <div class="card"><h3>매출·사업비·대출잔액</h3>${cfChart(R)}</div>
  <div class="tw"><table class="cf"><thead>${head}</thead><tbody>${body}</tbody></table></div>

    <tr><td>최대 대출잔액 (Peak)</td><td class="n">${fm(R.peak)}</td><td class="note">월${R.peakM} (${ym(st,R.peakM)})</td></tr>
    <tr><td>대출이자</td><td class="n">${fm(R.I.interest)}</td><td class="note">연 ${pc(S.fin.rate,2)}</td></tr>
    <tr><td>취급수수료</td><td class="n">${fm(R.I.fee)}</td><td class="note">최대잔액 × ${pc(S.fin.feeRate,2)}</td></tr>

    <tr class="tot"><td>금융비 합계</td><td class="n">${fm(R.finSub)}</td><td></td></tr></tbody></table></div></div>`; };

TABS.fund=()=>{ const R=compute(S), t=R.peakM, st=S.sched.start;
  const cum=a=>a.slice(0,t+1).reduce((x,y)=>x+y,0);

function loadMarket(o){ if(!o||o.kind!=="lh-plan-market"||!Array.isArray(o.trades)) throw new Error("market.json 형식이 아닙니다"); S.market=o; autoComps(); save(); render(); toast(`시장 데이터 ${o.trades.length}건을 불러왔습니다`); }

/* ============================== 인근 시세 사례 (시장현황 요약) ============================== */
function compsFromMarket(MS){
  const d=m=>m==null?"":m<1000?Math.round(m)+"m":(m/1000).toFixed(1)+"km";
  const rows=[];
  MS.cx.filter(c=>c.n>=2).slice(0,6).forEach(c=>rows.push({cat:"실거래", name:c.apt, year:String(c.buildYear||""), dist:d(c.siteM), n:c.n, when:ymDot(c.last.date), price:+(c.medP/1e8).toFixed(2), perPy:Math.round(c.medPy/1e4)}));
  MS.silvCx.slice().sort((a,b)=>b.n-a.n).slice(0,3).forEach(c=>rows.push({cat:"분양권", name:c.apt, year:"신축(분양권)", dist:d(c.siteM), n:c.n, when:ymDot(c.last.date), price:+(c.medP/1e8).toFixed(2), perPy:Math.round(c.medPy/1e4)}));
  const byName=new Map(); MS.ps.forEach(p=>{ if(!byName.has(p.name)) byName.set(p.name,[]); byName.get(p.name).push(p); });
  [...byName.values()].map(g=>({g, siteM:g[0].siteM})).sort((a,b)=>(a.siteM??1e9)-(b.siteM??1e9)).slice(0,3).forEach(({g})=>{
    const p=g[0], mv=String(p.moveIn||""); rows.push({cat:"분양", name:p.name, year:mv?"입주 "+mv.slice(0,4)+"."+mv.slice(4,6):"", dist:d(p.siteM), n:"", when:ymDot(p.notice),
      price:+(g.reduce((a,x)=>a+x.price,0)/g.length/1e8).toFixed(2), perPy:Math.round(g.reduce((a,x)=>a+x.perPy,0)/g.length/1e4)}); });
  return rows;
}
function autoComps(){ const MS=marketStats(S); if(MS){ S.comps=compsFromMarket(MS); return true; } return false; }
function compsTable(){ if(!S.comps.length) return "";
  const rev=S.units.reduce((a,u)=>a+u.count*u.price,0), lhPy=rev/S.units.reduce((a,u)=>a+u.count*u.excl*PY,0)/1e4, lhUnit=rev/S.units.reduce((a,u)=>a+u.count,0)/1e8;
  return `<div class="tw"><table><thead><tr><th>구분</th><th>단지명</th><th>준공·입주</th><th class="n">사업지<br>거리</th><th class="n">건수</th><th>기준시점</th><th class="n">중위가</th><th class="n">전용평당</th><th class="n">LH ÷ 사례</th></tr></thead><tbody>
    ${S.comps.map(c=>`<tr><td>${esc(c.cat)}</td><td>${esc(c.name)}</td><td>${esc(c.year)}</td><td class="n">${esc(c.dist)}</td><td class="n">${esc(c.n)}</td><td>${esc(c.when)}</td><td class="n">${+c.price?n0(c.price,2)+"억":"-"}</td><td class="n">${+c.perPy?n0(c.perPy)+"만":"-"}</td><td class="n">${+c.perPy?(lhPy/c.perPy*100).toFixed(1)+"%":"-"}</td></tr>`).join("")}
    <tr class="tot"><td colspan="6">본 사업 LH 매입예정가</td><td class="n">${n0(lhUnit,2)}억</td><td class="n">${n0(lhPy)}만</td><td></td></tr></tbody></table></div>`; }

function regexExtract(t){
  const T=t.replace(/\s+/g," "), n=s=>+String(s).replace(/,/g,"");

  const cnt=T.match(/(?:총\s*)?세\s*대\s*수[^\d]{0,10}([\d,]+)|([\d,]+)\s*세대/);
  return { siteM2:area(new RegExp("대\\s*지\\s*면\\s*적[^\\d]{0,20}([\\d,]+\\.?\\d*)"+U)),
    gfaM2:area(new RegExp("(?:^|[^지상하])\\s*연\\s*면\\s*적\\s*(?:합계|계)?[^\\d]{0,20}([\\d,]+\\.?\\d*)"+U)),
    aboveM2:area(new RegExp("용적률\\s*산정용\\s*연면적[^\\d]{0,20}([\\d,]+\\.?\\d*)"+U))||area(new RegExp("지\\s*상\\s*(?:층\\s*)?(?:연\\s*)?면\\s*적[^\\d]{0,20}([\\d,]+\\.?\\d*)"+U)),
    belowM2:area(new RegExp("지\\s*하\\s*(?:층\\s*)?(?:연\\s*)?면\\s*적[^\\d]{0,20}([\\d,]+\\.?\\d*)"+U)),
    bcr:(T.match(/건\s*폐\s*율[^\d]{0,15}([\d.]+\s*%)/)||[])[1]||null, far:(T.match(/용\s*적\s*률[^\d]{0,15}([\d.]+\s*%)/)||[])[1]||null,
    floors:(T.match(/(지하\s*\d+\s*층\s*[,/~·]?\s*지상\s*\d+\s*층)/)||[])[1]||null, parking:(T.match(/주\s*차\s*(?:대\s*수)?[^\d]{0,12}([\d,]+\s*대)/)||[])[1]||null,
    address:null, zone:(T.match(/(제[123]종\s*일반주거지역|준주거지역|일반상업지역|준공업지역|제[12]종\s*전용주거지역)/)||[])[1]||null,
    units:cnt?[{type:"합계",excl:null,count:n(cnt[1]||cnt[2])}]:[], notes:"규칙 기반 추출(키워드 인근 숫자) — 표 구조에 따라 틀릴 수 있어 반드시 확인하세요." };

async function readPdf(file){

    const N=Math.min(doc.numPages,15);
    for(let i=1;i<=N;i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); text+=`\n[p.${i}]\n`+tc.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join(""); }

        const lim=await sample.limits().catch(()=>null);
        if(!lim?.images) throw {code:"scan_no_images"};
        images=[];
        for(let i=1;i<=Math.min(N,lim.images.maxCount,4);i++){ const pg=await doc.getPage(i); const vp=pg.getViewport({scale:2}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
          await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; images.push(await new Promise(r=>c.toBlob(r,"image/png"))); }
      }

      pdfSet(`<p class="muted">Claude가 건축개요 항목을 찾는 중… 보통 10~60초 걸립니다${scanned?" (스캔본 — 페이지 이미지로 판독)":""}.</p>`);
      try{ out=await sample.json(pdfPrompt(scanned?"(글자 레이어가 없는 스캔본입니다. 첨부된 페이지 이미지를 읽으세요.)":text.slice(0,40000)), {signal:PDF.ctl.signal, images}); via="Claude 판독"; }
      catch(e){ if(UNAVAIL.includes(e?.code) && !scanned){ out=regexExtract(text); via="규칙 기반 추출 (Claude 사용 불가)"; } else throw e; }
    } else {
      if(scanned) throw {code:"scan_no_sample"};
      out=regexExtract(text); via="규칙 기반 추출";

      scan_no_sample:"글자 레이어가 없는 스캔 PDF입니다. Claude 판독을 쓸 수 없는 화면이라 값을 직접 입력해야 합니다.", not_granted:"Claude 사용이 허용되지 않았습니다. 규칙 기반 추출도 실패했습니다.",
      rate_limited:"요청이 많습니다. 잠시 후 다시 시도하세요.", invalid_json:"응답을 해석하지 못했습니다. 다시 시도하세요.", refused:"이 문서는 판독하지 못했습니다."}[e?.code]
      || (e?.name==="PasswordException"?"암호가 걸린 PDF입니다. 암호를 해제한 파일을 올려 주세요.":"PDF를 읽지 못했습니다: "+(e?.message||e?.code||e));
    pdfSet(`<div class="flag"><b>확인</b><span>${esc(msg)}</span></div>`);
  }finally{ PDF.ctl=null; pdfStop(false); }
}

  if(on("baseYear")&&d.pYear){ S.tax.baseYear=d.pYear; n++; }
  S.site.plans=d.plans; S.site.bldgs=d.bldgs.map(b=>({lot:b.lot,dong:b.dong,purpose:b.purpose,totArea:b.totArea,floorsAbove:b.floorsAbove,floorsBelow:b.floorsBelow,useAprDay:b.useAprDay}));
  LAND.data=null; LAND.html=""; recalc(); render(); toast(`${n}개 항목을 적용했습니다`); }

function renderKpis(){ const R=compute(S);
  $("#projTitle").textContent=S.meta.name||"(사업명)";
  $("#kpis").innerHTML=[["매출 (LH 매입)",eok(R.rev),`${n0(R.units)}세대 · 호당 ${n0(R.rev/R.units/1e6)}백만`],["총사업비",eok(R.total),`평당 ${n0(R.total/R.gfaPy/1e4)}만원`],
    ["세전 사업손익",eok(R.profit),`매출 대비 ${pc(R.margin)}`,1],["자기자본",eok(R.equity),R.eqAdd?`토지비 ${pc(S.land.eqRate,0)} + 한도보정 ${eok(R.eqAdd)}`:`토지비 ${pc(S.land.eqRate,0)}`],["Multiple / IRR",`${n0(R.moic,2)}x`,`IRR ${pc(R.irr)} · ${R.m.m7}개월`,1],["최대 대출잔액",eok(R.peak),`${ym(S.sched.start,R.peakM)} (월${R.peakM})`]]
    .map(([b,s,sm,hl])=>`<div class="kpi ${hl?"hl":""}"><b>${b}</b><span class="${s.startsWith("△")?"neg":""}">${s}</span><small>${sm}</small></div>`).join("");
}
function renderLive(){ const R=compute(S), L=k=>document.querySelector(`[data-live="${k}"]`), set=(k,h)=>{ const e=L(k); if(e) e.innerHTML=h; };
  set("sitePy",`= ${n0(R.landPy,2)}평`); set("gfaPy",`= ${n0(R.gfaPy,2)}평`); set("far",`용적률 ${pc(S.bldg.aboveM2/S.site.siteM2)}`);
  set("unitsum",`합계 ${n0(R.units)}세대 · 매출 ${eok(R.rev)}`); set("landBuy",`토지매입비 ${eok(R.I.landBuy)}`); set("equity",R.eqAdd?`자기자본 ${eok(R.equity)} = 기본 ${eok(R.eqBase)} + 한도보정 ${eok(R.eqAdd)}`:`자기자본 ${eok(R.equity)} (백만원 올림)`);
  set("appr",`토지 감정가 ${eok(R.apprLand)}`); set("support",`토지확보지원금 ${eok(R.support)}`); set("consAmt",`공사비 ${eok(R.I.cons)}`);
  set("curvesum",pc(S.lh.curve.reduce((a,b)=>a+b,0),1));
  set("curvewarn",Math.abs(S.lh.curve.reduce((a,b)=>a+b,0)-1)>0.0005||S.lh.curve.length!==+S.sched.cons?`<div class="flag"><b>확인</b><span>공정률 ${S.lh.curve.length}개월 · 합계 ${pc(S.lh.curve.reduce((a,b)=>a+b,0),1)} — 공사기간 ${S.sched.cons}개월, 합계 100%가 되어야 합니다.</span></div>`:"");
  set("gantt",gantt(R));
  set("taxtable",`<div class="tw"><table><thead><tr><th>과세연도</th><th class="n">과세표준</th><th class="n">재산세</th><th class="n">도시지역분</th><th class="n">지방교육세</th><th class="n">합계 (9월 납부)</th><th class="n">종부세</th></tr></thead><tbody>
    ${R.taxRows.map(r=>`<tr><td>${r.y}</td><td class="n">${won(r.base)}</td><td class="n">${won(r.prop)}</td><td class="n">${won(r.city)}</td><td class="n">${won(r.edu)}</td><td class="n">${won(r.total)}</td><td class="n">${won(r.comp)}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">보유기간 중 과세기준일(6.1) 없음</td></tr>`}
    </tbody></table></div><p class="muted" style="font-size:12px;margin:6px 0 0">과세표준 = 공시지가 총액 ${won(R.official)}원 × (1+상승률)^(연도−기준연도) × 공정시장가액비율. 원 단위.</p>`);
}
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===TAB?"page":"false"));
  document.querySelectorAll("#unitSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.u===UNIT?"true":"false"));
  $("#panel").innerHTML=TABS[TAB](); renderKpis(); renderLive();
}
const INPUT_TABS=new Set(["overview","plan","land","cost","fin"]);
function recalc(){ renderKpis(); if(INPUT_TABS.has(TAB)) renderLive(); else $("#panel").innerHTML=TABS[TAB](); save(); }

/* ============================== 이벤트 ============================== */
$("#nav").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(!b) return; TAB=b.dataset.tab; save(); render(); window.scrollTo({top:0}); });
$("#unitSeg").addEventListener("click",e=>{ const b=e.target.closest("button[data-u]"); if(!b) return; UNIT=b.dataset.u; save(); render(); });
$("#panel").addEventListener("input",e=>{ const el=e.target; if(!el.dataset.p) return;
  const v=el.dataset.k==="bool"?el.checked:parseIn(el); setP(S,el.dataset.p,v); recalc(); });
$("#panel").addEventListener("change",e=>{ const el=e.target;
  if(el.id==="pdfFile"&&el.files&&el.files[0]){ readPdf(el.files[0]); el.value=""; return; }
  if(el.id==="landFile"&&el.files&&el.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ loadLand(JSON.parse(fr.result)); }catch(err){ toast("불러오지 못했습니다: "+err.message); } }; fr.readAsText(el.files[0],"utf-8"); el.value=""; return; }
  if(el.id==="mktFile"&&el.files&&el.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ loadMarket(JSON.parse(fr.result)); }catch(err){ toast("불러오지 못했습니다: "+err.message); } }; fr.readAsText(el.files[0],"utf-8"); return; } if(el.dataset.k==="num"&&el.value!==""){ el.value=Number(parseIn(el)).toLocaleString("ko-KR",{maximumFractionDigits:6}); }
  if(el.dataset.p==="sched.cons" && TAB==="fin"){ /* 공사기간 변경 → 곡선 길이 경고는 LH 탭에서 */ } });
$("#panel").addEventListener("click",e=>{
  const a=e.target.closest("[data-add]"), d=e.target.closest("[data-del]");
  if(a){ getP(S,a.dataset.add).push({...NEWROW[a.dataset.add]}); recalc(); render(); }
  if(d){ getP(S,d.dataset.del).splice(+d.dataset.i,1); recalc(); render(); }
  if(e.target.id==="bCurve"){ S.lh.curve=sCurve(+S.sched.cons); const s=S.lh.curve.reduce((x,y)=>x+y,0); S.lh.curve[S.lh.curve.length-1]=+(S.lh.curve.at(-1)+1-s).toFixed(4); recalc(); render(); toast("표준 S-곡선을 생성했습니다"); }
  if(e.target.id==="bLandApply") applyLand();
  if(e.target.id==="bLandDiscard"){ LAND.data=null; landSet(""); }
  if(e.target.id==="bLandPaste") openDlg("토지·건물 데이터 가져오기","out/land.json 내용을 붙여넣고 [적용]을 누르세요.","",true);
  if(e.target.id==="bPdfApply") applyPdf();
  if(e.target.id==="bPdfDiscard"){ PDF.result=null; pdfSet(""); }
  if(e.target.id==="bPdfStop") PDF.ctl?.abort();
  if(e.target.id==="bCompsAuto"){ if(autoComps()){ recalc(); render(); toast("시장현황 요약으로 사례를 채웠습니다"); } }
  if(e.target.id==="bMktPaste") openDlg("시장 데이터 가져오기","out/market.json 내용을 붙여넣고 [적용]을 누르세요.","",true);
  if(e.target.id==="bMktClear"){ if(confirm("불러온 시장 데이터를 지웁니다.")){ S.market=null; recalc(); render(); } }
  if(e.target.id==="bMktText"){ const MS=marketStats(S); if(MS){ S.text.market=marketText(MS); recalc(); toast("시장 현황 문단을 교체했습니다"); } }
  if(e.target.id==="bTsv"){ const R=compute(S); const t=["구분\t항목\t금액(원)\t산출근거","매출\tLH 매매예정금액\t"+Math.round(R.rev)+"\t"]
      .concat(costRows(R).map(([g,l,v,n])=>`${g==="sub"||g==="tot"?"":g}\t${l}\t${Math.round(v)}\t${n||""}`)).concat(["\t세전 사업손익\t"+Math.round(R.profit)+"\t"]).join("\n");
    openDlg("사업수지표 (TSV)","전체 선택 후 엑셀에 붙여넣으세요.",t,false); }
});
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1800); }
const dlg=$("#dlg"); let dlgApply=false;
function openDlg(title,hint,text,apply){ $("#dlgTitle").textContent=title; $("#dlgHint").textContent=hint; $("#dlgText").value=text; $("#dlgOk").hidden=!apply; dlgApply=apply; dlg.showModal(); $("#dlgText").select(); }
$("#dlgClose").onclick=()=>dlg.close();
$("#dlgCopy").onclick=async()=>{ const ta=$("#dlgText"); ta.select(); try{ await navigator.clipboard.writeText(ta.value); toast("복사했습니다"); }catch(e){ try{ document.execCommand("copy"); toast("복사했습니다"); }catch(_){ toast("Ctrl+C로 복사하세요"); } } };
$("#dlgOk").onclick=()=>{ let o; try{ o=JSON.parse($("#dlgText").value); }catch(e){ toast("JSON 형식이 올바르지 않습니다 — 파일 내용을 그대로 붙여넣으세요"); return; }
  if(o&&o.kind==="lh-plan-land"){ try{ dlg.close(); if(TAB!=="overview"){ TAB="overview"; render(); } loadLand(o); }catch(e){ toast(e.message); } return; }
  if(o&&o.kind==="lh-plan-market"){ try{ loadMarket(o); dlg.close(); }catch(e){ toast(e.message); } return; }
  if(!o||!o.site||!o.units||!o.sched){ toast("사업 데이터(JSON 내보내기) 또는 market.json 이 아닙니다"); return; }
  S=normalize(o); save(); dlg.close(); render(); toast("불러왔습니다"); };
$("#bExport").onclick=()=>openDlg("사업 데이터 내보내기","이 텍스트를 저장해 두면 [JSON 가져오기]로 그대로 복원됩니다.",JSON.stringify(S,null,1),false);
$("#bImport").onclick=()=>openDlg("사업 데이터 가져오기","내보내기로 저장한 JSON을 붙여넣고 [적용]을 누르세요.","",true);
$("#bSample").onclick=()=>{ if(!confirm("현재 입력을 부천 춘의동 샘플로 바꿉니다. 계속할까요?")) return; S=normalize(JSON.parse(JSON.stringify(SAMPLE))); autoComps(); save(); render(); toast("샘플을 불러왔습니다"); };
$("#bNew").onclick=()=>{ if(!confirm("빈 양식으로 새로 시작합니다. 현재 입력은 사라집니다(필요하면 먼저 내보내기).")) return; S=JSON.parse(JSON.stringify(BLANK)); TAB="overview"; save(); render(); };

if(S.meta.name===SAMPLE.meta.name && Math.abs((+S.bldg.existingPy||0)-655.1545245685)<1e-6){ S.bldg.existingPy=SAMPLE.bldg.existingPy; S.site.plans=SAMPLE.site.plans; S.site.bldgs=SAMPLE.site.bldgs; save(); }
if(S.market && S.meta.name===SAMPLE.meta.name && (!S.comps.length || S.comps.every(c=>c.cat==="수동"))){ autoComps(); save(); }
render();
</script>
